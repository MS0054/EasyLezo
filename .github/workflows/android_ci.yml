name: Android CI/CD

# مشخص می‌کنیم که این پروسه با هر Push یا Pull Request روی برنچ main اجرا بشه
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. دانلود کدهای پروژه روی سرور گیت‌هاب
      - name: Checkout the code
        uses: actions/checkout@v5

      # ۲. نصب و تنظیم جاوا (نسخه ۱۷ معمولاً برای پروژه‌های مدرن اندروید مناسبه)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      # ۳. دادن دسترسی اجرایی به فایل gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

#       ۴. اضافه کردن مرحله اجرای یونیت تست‌ها
#      - name: Run Unit Tests
#        run: ./gradlew testDebugUnitTest

      # ۵. اجرای سورس‌کد و بیلد کردن پروژه (نسخه پکیج Debug)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

          # مرحله جدید: آپلود و ذخیره فایل APK در گیت‌هاب
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-lezo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # مرحله جدید: ارسال خودکار فایل APK به تلگرام
      - name: Send APK to Telegram
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: app/build/outputs/apk/debug/app-debug.apk
          message: |
              🚀 نسخه جدید اپلیکیشن EasyLezo با موفقیت بیلد شد!
              
              توسط: ${{ github.actor }}
              کامیت: ${{ github.event.head_commit.message }}